# SearXNG settings for the Anker stack.
# Mounted into /etc/searxng inside the container.
# Required: SEARXNG_SECRET in env (an `openssl rand -hex 32`).
#
# We enable JSON output (Anker's web-search lib expects it) and turn
# off image proxying / autocompleter — neither is useful here.

use_default_settings: true

general:
  instance_name: "Anker SearXNG"
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json    # Anker's lib/agents/web-search.ts requires this
  default_lang: "en"

server:
  base_url: "http://localhost:8080/"
  image_proxy: false
  http_protocol_version: "1.1"
  method: "GET"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Frame-Options: DENY
    Referrer-Policy: no-referrer

ui:
  static_use_hash: true
  query_in_title: true

# Bot-detection friendly: limit to engines that don't aggressively
# rate-limit IP-based access.
engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: qwant
    disabled: false
  - name: google
    disabled: true   # Google blocks SearXNG IPs aggressively
