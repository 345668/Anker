  <ellipse cx="170" cy="38" rx="166" ry="34" fill="none" stroke="url(#anker-chrome-dark)" stroke-width="3.5"/>
  <ellipse cx="170" cy="38" rx="162.5" ry="30.5" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.75"/>
  <text x="181" y="39" text-anchor="middle" dominant-baseline="central" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="600" letter-spacing="21" fill="url(#anker-chrome-dark)">ANKER</text>
</svg>
