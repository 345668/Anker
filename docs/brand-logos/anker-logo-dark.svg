<svg viewBox="0 0 340 76" width="340" height="76" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anker">
  <title>Anker — dark mode</title>
  <defs>
    <linearGradient id="anker-chrome-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfd"/>
      <stop offset="16%" stop-color="#d3d8df"/>
      <stop offset="34%" stop-color="#878e98"/>
      <stop offset="49%" stop-color="#5c636b"/>
      <stop offset="51%" stop-color="#6b727a"/>
      <stop offset="70%" stop-color="#a9b0b9"/>
      <stop offset="85%" stop-color="#eceef2"/>
      <stop offset="100%" stop-color="#aeb4bd"/>
    </linearGradient>
    <linearGradient id="anker-red-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0472e"/>
      <stop offset="18%" stop-color="#e0201d"/>
      <stop offset="52%" stop-color="#c20d11"/>
      <stop offset="100%" stop-color="#7f0a0d"/>
    </linearGradient>
  </defs>
  <!-- Candy-red medallion fill, inset just inside the chrome frame (dark-mode only) -->
